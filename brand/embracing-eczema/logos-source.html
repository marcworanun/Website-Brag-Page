<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=block" rel="stylesheet">
<style>
  body { margin: 0; padding: 30px; background: transparent; font-family: 'Poppins', sans-serif; }
  .logo { display: inline-flex; align-items: center; padding: 24px; }
  .stacked { flex-direction: column; gap: 10px; }
  .horizontal { gap: 26px; }
  .word { color: #3b4048; font-weight: 500; letter-spacing: .32em; line-height: 1.25; white-space: nowrap; }
  .stacked .word { font-size: 30px; margin-right: -.32em; }
  .horizontal .word { font-size: 34px; }
  svg { display: block; }
</style></head><body>

<!-- Concept A: the sign's heart rising over three waves, waves in the glove colours -->
<svg id="iconA" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220">
  <g fill="none" stroke-linecap="round">
    <g stroke="#e58ba4" stroke-width="6">
      <line x1="73.7" y1="75.1" x2="62.1" y2="72.0"/>
      <line x1="89.2" y1="47.6" x2="81.9" y2="38.6"/>
      <line x1="120" y1="38" x2="120" y2="26"/>
      <line x1="150.8" y1="47.6" x2="158.1" y2="38.6"/>
      <line x1="166.3" y1="75.1" x2="177.9" y2="72.0"/>
    </g>
    <path d="M56 150 q16 -11 32 0 t32 0 t32 0 t32 0" stroke="#ee8fab" stroke-width="10"/>
    <path d="M56 172 q16 -11 32 0 t32 0 t32 0 t32 0" stroke="#a992d6" stroke-width="10"/>
    <path d="M56 194 q16 -11 32 0 t32 0 t32 0 t32 0" stroke="#6fb3e3" stroke-width="10"/>
  </g>
  <path transform="translate(120 94) scale(36)" fill="#b23a5b"
        d="M0 0.9 C-0.6 0.45 -1 0.1 -1 -0.35 C-1 -0.75 -0.65 -1 -0.35 -1 C-0.15 -1 0 -0.85 0 -0.65 C0 -0.85 0.15 -1 0.35 -1 C0.65 -1 1 -0.75 1 -0.35 C1 0.1 0.6 0.45 0 0.9 Z"/>
</svg>

<!-- Concept B: two glove halves, dotted like the gloves' ventilation holes, embracing to make a heart -->
<svg id="iconB" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220">
  <defs>
    <path id="heartB" transform="translate(120 112) scale(92)"
          d="M0 0.9 C-0.6 0.45 -1 0.1 -1 -0.35 C-1 -0.75 -0.65 -1 -0.35 -1 C-0.15 -1 0 -0.85 0 -0.65 C0 -0.85 0.15 -1 0.35 -1 C0.65 -1 1 -0.75 1 -0.35 C1 0.1 0.6 0.45 0 0.9 Z"/>
    <clipPath id="leftB"><rect x="0" y="0" width="115" height="220"/></clipPath>
    <clipPath id="rightB"><rect x="125" y="0" width="115" height="220"/></clipPath>
  </defs>
  <g clip-path="url(#leftB)"><use href="#heartB" fill="#ee8fab"/></g>
  <g clip-path="url(#rightB)"><use href="#heartB" fill="#6fb3e3"/></g>
  <g id="dotsB" fill="#ffffff"></g>
</svg>

<div id="aStacked" class="logo stacked"></div>
<div id="aHorizontal" class="logo horizontal"></div>
<div id="bStacked" class="logo stacked"></div>
<div id="bHorizontal" class="logo horizontal"></div>

<script>
  // Ventilation dots for concept B: a grid, keeping only dots fully inside each half
  const hb = document.querySelector('#heartB'), svgB = document.querySelector('#iconB'), dots = document.querySelector('#dotsB');
  const pt = svgB.createSVGPoint();
  const m = hb.getCTM();
  const inside = (x, y) => { pt.x = x; pt.y = y; return hb.isPointInFill(pt.matrixTransform(m.inverse())); };
  // Left half only, then mirrored, so both gloves match
  const r = 7, margin = 7;
  const dot = (x, y) => { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); dots.appendChild(c); };
  for (let y = 62; y <= 176; y += 27) for (let x = 84; x >= 20; x -= 27) {
    let ok = true;
    for (let a = 0; a < 360; a += 20) { const t = a * Math.PI / 180; if (!inside(x + (r + margin) * Math.cos(t), y + (r + margin) * Math.sin(t))) { ok = false; break; } }
    if (ok) { dot(x, y); dot(240 - x, y); }
  }
  const word2 = '<div class="word">EMBRACING<br>ECZEMA</div>', word1 = '<div class="word">EMBRACING ECZEMA</div>';
  const A = document.querySelector('#iconA').outerHTML, B = document.querySelector('#iconB').outerHTML;
  const sized = (svg, w, h) => svg.replace(/ id="icon[AB]"/, '').replace(/width="240" height="220"/, `width="${w}" height="${h}"`);
  document.querySelector('#aStacked').innerHTML = sized(A, 190, 174) + word1;
  document.querySelector('#aHorizontal').innerHTML = sized(A, 130, 119) + word2;
  // Concept B reuses ids; give each copy its own so clip paths resolve
  const uniq = (svg, k) => svg.replaceAll('heartB', 'heartB' + k).replaceAll('leftB', 'leftB' + k).replaceAll('rightB', 'rightB' + k).replaceAll('dotsB', 'dotsB' + k);
  document.querySelector('#bStacked').innerHTML = uniq(sized(B, 190, 174), 1) + word1;
  document.querySelector('#bHorizontal').innerHTML = uniq(sized(B, 130, 119), 2) + word2;
  window.dotCount = dots.children.length;
</script>
</body></html>
